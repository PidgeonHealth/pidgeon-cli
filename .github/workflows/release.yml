# Protected release for PidgeonHealth/pidgeon-cli: publishes the `Pidgeon.CLI`
# dotnet tool to nuget.org through OIDC Trusted Publishing (D3, release policy
# § 6–7). The workflow is dispatch-only and dry-run-first. The protected job
# promotes one approved package; it never repacks the candidate.

name: release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish-cli" to allow a real publish to nuget.org.'
        type: string
        required: false
      dry_run:
        description: 'Pack and verify one candidate; do not publish.'
        type: boolean
        default: true
      candidate_run_id:
        description: 'Successful dry-run run containing the approved CLI candidate.'
        type: string
        required: false
      cli_sha256:
        description: 'Approved unsigned Pidgeon.CLI nupkg SHA-256.'
        type: string
        required: false
      sbom_sha256:
        description: 'Approved normalized SPDX manifest SHA-256.'
        type: string
        required: false
      controls_receipt_sha256:
        description: 'Approved external release-control receipt SHA-256.'
        type: string
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release intent
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          DRY_RUN: ${{ inputs.dry_run }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CLI_SHA256: ${{ inputs.cli_sha256 }}
          SBOM_SHA256: ${{ inputs.sbom_sha256 }}
          CONTROLS_RECEIPT_SHA256: ${{ inputs.controls_receipt_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" && "$GITHUB_REF_TYPE" == "branch" ]]; then
            repo_json="$(gh api "repos/$GITHUB_REPOSITORY")"
            default_branch="$(jq -r '.default_branch' <<<"$repo_json")"
            [[ "$GITHUB_REF_NAME" == "$default_branch" ]] || {
              echo '::error::An unpublished branch dry run must use the default branch.'; exit 1;
            }
            branch_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME" --jq '.commit.sha')"
            [[ "$branch_sha" == "$GITHUB_SHA" ]] || {
              echo '::error::An unpublished dry run must use the exact default-branch head.'; exit 1;
            }
          else
            [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == "v0.1.0-beta.1" ]] || {
              echo '::error::Publication and tagged staging require protected v0.1.0-beta.1.'; exit 1;
            }
            tag_ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
            tag_type="$(jq -r '.object.type' <<<"$tag_ref_json")"
            if [[ "$tag_type" != "tag" ]]; then
              echo '::error::The release ref must be an annotated signed tag, not a lightweight tag.'
              exit 1
            fi
            tag_sha="$(jq -r '.object.sha' <<<"$tag_ref_json")"
            tag_json="$(curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
            if [[ "$(jq -r '.verification.verified' <<<"$tag_json")" != "true" ]]; then
              echo '::error::The release tag must be a GitHub-verified annotated tag.'
              exit 1
            fi
            if [[ "$(jq -r '.object.sha' <<<"$tag_json")" != "$GITHUB_SHA" ]]; then
              echo '::error::The verified tag must point directly at the workflow commit.'
              exit 1
            fi
          fi

          if [[ "$DRY_RUN" == "false" ]]; then
            [[ "$CONFIRM" == "publish-cli" ]] || {
              echo '::error::A real publish requires confirm=publish-cli.'; exit 1;
            }
            [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || {
              echo '::error::A real publish requires a numeric candidate_run_id.'; exit 1;
            }
            for value in "$CLI_SHA256" "$SBOM_SHA256" "$CONTROLS_RECEIPT_SHA256"; do
              [[ "$value" =~ ^[0-9a-f]{64}$ ]] || {
                echo '::error::Every approved candidate hash must be 64 lowercase hex characters.'; exit 1;
              }
            done
          fi
          echo "Release preflight accepted (dry_run=$DRY_RUN)."

  stage-candidate:
    needs: preflight
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.423

      - name: Restore the locked community CLI
        run: dotnet restore Pidgeon.sln --locked-mode --source https://api.nuget.org/v3/index.json

      - name: Build the community CLI
        run: dotnet build Pidgeon.sln --no-restore -c Release

      - name: Run the community command battery
        run: bash pidgeon-tests/public-cli-smoke.sh pidgeon-cli/src/Pidgeon.CLI/bin/Release/net8.0/Pidgeon.CLI 0.1.0-beta.1

      - name: Pack one unsigned CLI candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate/packages
          dotnet pack pidgeon-cli/src/Pidgeon.CLI/Pidgeon.CLI.csproj \
            --no-build --no-restore -c Release -o artifacts/candidate/packages \
            -p:IncludeSymbols=false -p:SymbolPackageFormat=snupkg

      - name: Normalize the NuGet candidate archive
        shell: bash
        run: |
          set -euo pipefail
          package="$GITHUB_WORKSPACE/artifacts/candidate/packages/Pidgeon.CLI.0.1.0-beta.1.nupkg"
          python3 - "$package" <<'PY'
          import hashlib
          import pathlib
          import re
          import sys
          import zipfile

          package = pathlib.Path(sys.argv[1])
          normalized = package.with_suffix('.normalized.nupkg')
          fixed_core = 'package/services/metadata/core-properties/pidgeon-core-properties.psmdcp'

          with zipfile.ZipFile(package) as source:
              names = source.namelist()
              core = [
                  name for name in names
                  if re.fullmatch(r'package/services/metadata/core-properties/[0-9a-f]+\.psmdcp', name)
              ]
              if len(core) != 1:
                  raise SystemExit(f'expected one generated core-properties file, found {core!r}')
              if len(names) != len(set(names)):
                  raise SystemExit('candidate archive contains duplicate entries')

              with zipfile.ZipFile(
                  normalized,
                  'w',
                  compression=zipfile.ZIP_DEFLATED,
                  compresslevel=9,
              ) as destination:
                  # Preserve NuGet's original entry order and ZIP metadata.
                  # SSL.com CodeSignTool signs the archive structure as NuGet
                  # defines it; rewriting those fields (especially the origin
                  # and external attributes) can produce a signature that
                  # reports NU3008 even though the payload files are unchanged.
                  for entry in source.infolist():
                      name = entry.filename
                      target = fixed_core if name == core[0] else name
                      data = source.read(name)
                      if name == '_rels/.rels':
                          data = re.sub(
                              rb'Target="/package/services/metadata/core-properties/[0-9a-f]+\.psmdcp"',
                              b'Target="/package/services/metadata/core-properties/pidgeon-core-properties.psmdcp"',
                              data,
                          )
                          data, replacements = re.subn(
                              rb'(<Relationship\s+Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties"\s+'
                              rb'Target="/package/services/metadata/core-properties/pidgeon-core-properties\.psmdcp"\s+Id=")[^"]+("\s*/>)',
                              rb'\1Rcore\2',
                              data,
                          )
                          if replacements != 1:
                              raise SystemExit('could not normalize the core-properties relationship')

                      info = zipfile.ZipInfo(target, date_time=(1980, 1, 1, 0, 0, 0))
                      info.compress_type = entry.compress_type
                      info.create_system = entry.create_system
                      info.create_version = entry.create_version
                      info.extract_version = entry.extract_version
                      info.flag_bits = entry.flag_bits
                      info.volume = entry.volume
                      info.internal_attr = entry.internal_attr
                      info.external_attr = entry.external_attr
                      info.extra = entry.extra
                      info.comment = entry.comment
                      destination.writestr(info, data)

          normalized.replace(package)
          with zipfile.ZipFile(package) as check:
              check.testzip()
              if check.namelist() != names:
                  raise SystemExit('normalized archive changed NuGet entry order')
              if fixed_core not in check.namelist():
                  raise SystemExit('normalized archive is missing the fixed core-properties path')
          print(f'normalized {package} sha256={hashlib.sha256(package.read_bytes()).hexdigest()}')
          PY

          test -f artifacts/candidate/packages/Pidgeon.CLI.0.1.0-beta.1.nupkg
          test "$(find artifacts/candidate/packages -maxdepth 1 -name '*.nupkg' | wc -l)" -eq 1
          test "$(find artifacts/candidate/packages -maxdepth 1 -name '*.snupkg' | wc -l)" -eq 0

      - name: Download and verify the reviewed SBOM tool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/microsoft/sbom-tool/releases/download/v4.1.5/sbom-tool-linux-x64 \
            --output "$RUNNER_TEMP/sbom-tool"
          echo 'bf5d4f99bc98c119d549d08fc02ae92598a7a42772f17317c01031a92632e05b  '"$RUNNER_TEMP/sbom-tool" | sha256sum --check
          chmod 0555 "$RUNNER_TEMP/sbom-tool"

      - name: Generate and validate candidate SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate/sbom
          generated_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          "$RUNNER_TEMP/sbom-tool" generate \
            -b "$GITHUB_WORKSPACE/artifacts/candidate/packages" \
            -bc "$GITHUB_WORKSPACE" \
            -m "$GITHUB_WORKSPACE/artifacts/candidate/sbom" \
            -pn Pidgeon.CLI-public-source -pv 0.1.0-beta.1 -ps 'Pidgeon Health' \
            -nsb https://pidgeon.health/sbom -nsu "$GITHUB_SHA" -gt "$generated_at" \
            -pm true -li false -F false
          manifest='artifacts/candidate/sbom/_manifest/spdx_2.2/manifest.spdx.json'
          jq --sort-keys --arg candidate "$GITHUB_SHA" \
            'walk(if type == "string" then sub("tag_id=[0-9a-fA-F-]+"; "tag_id=" + $candidate) elif type == "array" then sort_by(tostring) else . end)' \
            "$manifest" > "$RUNNER_TEMP/manifest.spdx.json"
          mv "$RUNNER_TEMP/manifest.spdx.json" "$manifest"
          sha256sum "$manifest" | awk '{print $1}' > "$manifest.sha256"
          "$RUNNER_TEMP/sbom-tool" validate \
            -b "$GITHUB_WORKSPACE/artifacts/candidate/packages" \
            -m "$GITHUB_WORKSPACE/artifacts/candidate/sbom/_manifest" \
            -o "$GITHUB_WORKSPACE/artifacts/candidate/sbom/validation.json" \
            -mi SPDX:2.2 -n true -F false

      - name: Seal candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          package='artifacts/candidate/packages/Pidgeon.CLI.0.1.0-beta.1.nupkg'
          sbom='artifacts/candidate/sbom/_manifest/spdx_2.2/manifest.spdx.json'
          package_sha256="$(sha256sum "$package" | awk '{print $1}')"
          sbom_sha256="$(sha256sum "$sbom" | awk '{print $1}')"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg tag "$GITHUB_REF_NAME" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg package_sha256 "$package_sha256" \
            --arg sbom_sha256 "$sbom_sha256" \
            '{schema: 1, surface: "cli", repository: $repository, commit: $commit, tag: $tag,
              run_id: $run_id, version: "0.1.0-beta.1", packages: {"Pidgeon.CLI": {nupkg_sha256: $package_sha256}},
              sbom_sha256: $sbom_sha256}' > artifacts/candidate/candidate.json
          jq . artifacts/candidate/candidate.json

      - name: Upload sealed CLI candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pidgeon-cli-candidate-${{ github.run_id }}
          path: artifacts/candidate
          if-no-files-found: error
          retention-days: 90

      - name: Dry-run summary
        run: |
          echo 'Dry run: one CLI candidate and its SBOM were sealed and left unpublished.' | tee -a "$GITHUB_STEP_SUMMARY"
          jq . artifacts/candidate/candidate.json | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    needs: preflight
    if: ${{ inputs.dry_run == false }}
    runs-on: windows-latest
    environment: cli-package
    permissions:
      actions: read
      contents: write
      id-token: write
    timeout-minutes: 60
    env:
      CODESIGNTOOL_VERSION: '1.3.3'
      CODESIGNTOOL_SHA256: 317d429be3aa12a5f2c1ffdd575eab0cb0ce5e2408ab0056bcdcaab29875f73d
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      APPROVED_CLI_SHA256: ${{ inputs.cli_sha256 }}
      APPROVED_SBOM_SHA256: ${{ inputs.sbom_sha256 }}
      APPROVED_CONTROLS_RECEIPT_SHA256: ${{ inputs.controls_receipt_sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download the approved sealed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: pidgeon-cli-candidate-${{ inputs.candidate_run_id }}
          path: artifacts/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.423

      - name: Verify approved candidate identity and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Get-Content artifacts/candidate/candidate.json -Raw | ConvertFrom-Json
          if ($candidate.repository -ne $env:GITHUB_REPOSITORY -or
              $candidate.commit -ne $env:GITHUB_SHA -or
              $candidate.tag -ne $env:GITHUB_REF_NAME -or
              $candidate.run_id -ne [int64]$env:CANDIDATE_RUN_ID -or
              $candidate.version -ne '0.1.0-beta.1') { throw 'sealed candidate identity does not match the approved workflow inputs' }
          $package = 'artifacts/candidate/packages/Pidgeon.CLI.0.1.0-beta.1.nupkg'
          $sbom = 'artifacts/candidate/sbom/_manifest/spdx_2.2/manifest.spdx.json'
          if (@(Get-ChildItem artifacts/candidate/packages/*.nupkg).Count -ne 1) { throw 'sealed candidate must contain exactly one nupkg' }
          $actualPackage = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualSbom = (Get-FileHash $sbom -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualPackage -ne $env:APPROVED_CLI_SHA256 -or $actualPackage -ne $candidate.packages.'Pidgeon.CLI'.nupkg_sha256) { throw 'CLI candidate hash does not match the sealed and approved values' }
          if ($actualSbom -ne $env:APPROVED_SBOM_SHA256 -or $actualSbom -ne $candidate.sbom_sha256) { throw 'candidate SBOM hash does not match the sealed and approved values' }

      - name: Download and verify eSigner CodeSignTool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "CodeSignTool-v$env:CODESIGNTOOL_VERSION-windows.zip"
          Invoke-WebRequest -Uri 'https://www.ssl.com/download/codesigntool-for-windows/' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CODESIGNTOOL_SHA256) { throw 'eSigner CodeSignTool archive digest mismatch' }
          $installDir = Join-Path $env:RUNNER_TEMP "CodeSignTool-v$env:CODESIGNTOOL_VERSION"
          Expand-Archive -Path $archive -DestinationPath $installDir
          $tool = Join-Path $installDir 'CodeSignTool.bat'
          $properties = Join-Path $installDir 'conf\code_sign_tool.properties'
          if (-not (Test-Path $tool) -or -not (Test-Path $properties)) { throw 'eSigner CodeSignTool archive is incomplete' }
          if (-not (Select-String -Path $properties -SimpleMatch 'TSA_LEGACY_URL=' -Quiet)) {
            $contents = (Get-Content -Path $properties -Raw).TrimEnd([char[]]"`r`n") + "`r`nTSA_LEGACY_URL=http://ts.ssl.com/legacy`r`n"
            Set-Content -Path $properties -Value $contents -NoNewline
          }
          if ((ConvertFrom-StringData (Get-Content -Path $properties -Raw)).TSA_LEGACY_URL -ne 'http://ts.ssl.com/legacy') { throw 'legacy timestamp endpoint was not configured' }
          "CODE_SIGN_TOOL_PATH=$installDir" | Out-File $env:GITHUB_ENV -Append
          "CODESIGNTOOL_PATH=$tool" | Out-File $env:GITHUB_ENV -Append

      - name: Pre-sign malware scan exact candidate package
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE 'artifacts/candidate/packages/Pidgeon.CLI.0.1.0-beta.1.nupkg')).Path
          Push-Location $env:CODE_SIGN_TOOL_PATH
          try {
            & $env:CODESIGNTOOL_PATH scan_code "-credential_id=$env:CREDENTIAL_ID" "-username=$env:ES_USERNAME" "-password=$env:ES_PASSWORD" "-input_file_path=$package"
            if ($LASTEXITCODE -ne 0) { throw 'pre-sign malware scan failed' }
          } finally { Pop-Location }

      - name: Author-sign the exact candidate package
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signedDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/signed'
          New-Item -ItemType Directory -Force $signedDir | Out-Null
          $package = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE 'artifacts/candidate/packages/Pidgeon.CLI.0.1.0-beta.1.nupkg')).Path
          Push-Location $env:CODE_SIGN_TOOL_PATH
          try {
            & $env:CODESIGNTOOL_PATH sign "-credential_id=$env:CREDENTIAL_ID" "-username=$env:ES_USERNAME" "-password=$env:ES_PASSWORD" "-totp_secret=$env:ES_TOTP_SECRET" "-input_file_path=$package" "-output_dir_path=$signedDir"
            if ($LASTEXITCODE -ne 0) { throw 'author-sign failed' }
          } finally { Pop-Location }

      - name: Verify author signature and record signed payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = 'artifacts/signed/Pidgeon.CLI.0.1.0-beta.1.nupkg'
          $verify = dotnet nuget verify $signed --all 2>&1 | Out-String
          $verify | Out-File artifacts/d3-package-signing.txt
          Write-Output $verify
          if ($LASTEXITCODE -ne 0 -or $verify -notmatch 'Signature type: Author' -or $verify -notmatch 'Pattern Engine LLC') {
            throw "author-signature verification failed (dotnet exit code $LASTEXITCODE)"
          }
          "author_signed_sha256=$((Get-FileHash $signed -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File artifacts/d3-package-signing.txt -Append
          "controls_receipt_sha256=$env:APPROVED_CONTROLS_RECEIPT_SHA256" | Out-File artifacts/d3-package-signing.txt -Append
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $signed))
          try {
            $lines = $archive.Entries | Where-Object { $_.FullName -ne '.signature.p7s' -and -not $_.FullName.EndsWith('/') } | Sort-Object FullName | ForEach-Object {
              $stream = $_.Open(); try { "$($_.FullName)=$([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($stream)).ToLowerInvariant())" } finally { $stream.Dispose() }
            }
            $payload = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes(($lines -join "`n")))).ToLowerInvariant()
          } finally { $archive.Dispose() }
          "AUTHOR_CLI_PAYLOAD_SHA256=$payload" | Out-File $env:GITHUB_ENV -Append

      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish or resume only an exact live payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $id = 'pidgeon.cli'; $uri = "https://api.nuget.org/v3-flatcontainer/$id/0.1.0-beta.1/$id.0.1.0-beta.1.nupkg"
          New-Item -ItemType Directory -Force artifacts/live | Out-Null
          $existing = 'artifacts/live/Pidgeon.CLI.0.1.0-beta.1.nupkg'; $already = $false
          try { Invoke-WebRequest -Uri $uri -OutFile $existing; $already = $true } catch {
            if ($null -eq $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          if ($already) {
            $verify = dotnet nuget verify $existing --all 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $verify -notmatch 'Signature type: Author' -or $verify -notmatch 'Pattern Engine LLC' -or $verify -notmatch 'Signature type: Repository') { throw 'Pidgeon.CLI already exists without the required author/repository signatures' }
            "registry_resume=already-signed" | Out-File artifacts/d3-package-signing.txt -Append
          } else {
            dotnet nuget push artifacts/signed/Pidgeon.CLI.0.1.0-beta.1.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) { throw 'NuGet publication failed' }
            Invoke-WebRequest -Uri $uri -OutFile $existing
            "registry_resume=published-now" | Out-File artifacts/d3-package-signing.txt -Append
          }
          $liveVerify = dotnet nuget verify $existing --all 2>&1 | Out-String
          $liveVerify | Out-File artifacts/d3-package-signing.txt -Append
          if ($LASTEXITCODE -ne 0 -or $liveVerify -notmatch 'Signature type: Repository') { throw 'live repository signature verification failed' }

      - name: Create immutable GitHub Release from exact live bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item artifacts/live/Pidgeon.CLI.0.1.0-beta.1.nupkg artifacts/release/
          Copy-Item artifacts/candidate/candidate.json artifacts/release/
          Copy-Item artifacts/candidate/sbom/_manifest/spdx_2.2/manifest.spdx.json artifacts/release/Pidgeon.CLI.spdx.json
          $lines = Get-ChildItem artifacts/release/* | Sort-Object Name | ForEach-Object { "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)".ToLowerInvariant() }
          $lines | Out-File artifacts/release/SHA256SUMS -Encoding ascii
          @("candidate_run_id=$env:CANDIDATE_RUN_ID", "commit=$env:GITHUB_SHA", "tag=$env:GITHUB_REF_NAME", "unsigned_cli_sha256=$env:APPROVED_CLI_SHA256", "sbom_sha256=$env:APPROVED_SBOM_SHA256", "controls_receipt_sha256=$env:APPROVED_CONTROLS_RECEIPT_SHA256", "live_cli_sha256=$((Get-FileHash artifacts/live/Pidgeon.CLI.0.1.0-beta.1.nupkg -Algorithm SHA256).Hash.ToLowerInvariant())") | Out-File artifacts/release/d3-release-receipt.txt -Encoding ascii
          gh release create v0.1.0-beta.1 --repo $env:GITHUB_REPOSITORY --verify-tag --draft --prerelease --title 'Pidgeon CLI 0.1.0-beta.1' --notes 'Community Pidgeon CLI beta.1. Exact package bytes are mirrored here for provenance and direct download.' artifacts/release/*
          gh release edit v0.1.0-beta.1 --repo $env:GITHUB_REPOSITORY --draft=false
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v0.1.0-beta.1" | ConvertFrom-Json
          if (-not $release.immutable) { throw 'published GitHub Release is not immutable' }

      - name: Upload sanitized D3 receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pidgeon-cli-d3-receipt-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 90
